name: Native Linux CI - Tier 1 (image build + smoke)

# Tier 1: the heavy native-Linux check — build the real agent image with real
# Docker on a hosted ubuntu-latest runner (a native-Linux VM running a
# first-class Docker daemon, not Docker Desktop on Windows/WSL), then run the
# smoke test. Green here is a PARTIAL smoke, not a full one: the hosted runner
# exposes no /dev/net/tun, so Stage 3's nested half self-skips (see the smoke
# step's comment at the bottom of this file, and docs/smoke-tests.md). What it
# does reproduce is the build / mount / identity / exec-bit defect class that
# only surfaces on a native-Linux host (PRs #51/#52/#54/#55) and previously cost
# a human a VPS stand-up.
#
# Two images are supported, and an image no CI run builds rots: the LEAN image a
# new user gets (agent directly on the base, no .powbox-layers) and lean + the
# committed `full` layer set (base -> powbox-agent-layers -> agent), which the
# maintainer runs. So the job builds and smokes both, in two sequential passes,
# lean first: powbox-agent:latest is one tag on one parent at a time, so the
# passes cannot share an agent image, and the agent install layers are built
# twice because their parent differs. Each pass asserts the
# powbox.layers.set label of the agent image it built, so a pass that silently
# built on the wrong parent fails instead of smoking the same image twice.
#
# Path-gated: across recent history most PRs are skill/docs/launcher edits, so
# this runs ONLY when an image-affecting file changes. Tier 0
# (.github/workflows/native-linux-ci.yml) covers the rest — every PR EXCEPT one
# carrying the repo's `non-code` label, whose job `if:` gates the static guards
# off too (see that file's header). The scripts/smoke-test* glob below matches
# every per-stage smoke script, so adding one is enough to TRIGGER Tier 1 — but
# not to join the smoke run: commands/smoke-test.sh (and its PowerShell mirror)
# invokes each stage script by name, with its own gate and skip wiring, so a new
# stage runs here only once the umbrella is edited to call it. Task 005's
# scripts/smoke-test-dirmount.* took both steps before it ran here as Stage 5.
#
# The Bash umbrella is not the whole smoke run here: a second step runs the
# PowerShell Stage 6 driver directly, because commands/smoke-test.sh never
# invokes the .ps1 mirror and this runner is the only automated place where its
# mountpoint-ownership assertions are not vacuous. See that step's own comment.
#
# NOTE (branch protection): Tier 1 intentionally does not run on every PR — it
# is path-gated, base-branch-gated (only PRs targeting main, see `on:` below),
# and label-skippable (the `non-code` job `if:` below). main IS protected by
# the `main-guard` ruleset (PR required, no force-push, no deletion) but has NO
# required status checks, so none of these skips can block a merge today. If
# Tier 1 (or Tier 0) is ever marked a *required* status check, use a check that
# tolerates skipped runs (or keep it non-required) so docs/`non-code`/
# non-main-targeting PRs are not blocked waiting on a job that intentionally
# never starts.

on:
  pull_request:
    # Base-branch gate: on.pull_request.branches filters on the PR's TARGET
    # (base) branch, so the heavy Tier 1 build+smoke runs ONLY for PRs merging
    # into main. Stacked children whose base is a parent feature branch skip
    # Tier 1 and iterate fast; each branch still gets exactly one Tier 1 run at
    # the moment it is retargeted to main and rebased — right before it can
    # compromise main, never on intermediate iterations.
    #
    # Auto-retarget caveat (not a bug): when a parent PR merges, GitHub
    # auto-retargets its children to main. That base change fires a pull_request
    # `edited` action, which is deliberately NOT in `types` below, so the
    # retarget alone does NOT start Tier 1. In the rebase-stack flow the child is
    # then rebased onto main and force-pushed, which fires `synchronize` and DOES
    # trigger Tier 1 — so the run still happens before merge. `edited` is left
    # out on purpose: it also fires on every title/body edit and would re-run
    # Tier 1 needlessly.
    #
    # types: only the pull_request defaults (opened, synchronize, reopened).
    # Unlike Tier 0, Tier 1 deliberately does NOT add labeled/unlabeled. The
    # path + base gates already subsume the `non-code` job gate below — a
    # docs/`non-code` PR never matches the image `paths:`, so no label toggle
    # should ever start (or skip) a Tier 1 run and the job-level label gate is
    # pure belt-and-suspenders here. Omitting the label-only triggers also keeps
    # Tier 1 strictly path/base-gated: GitHub is reported not to apply `paths:`
    # to labeled/unlabeled activity types, so including them could let a bare
    # label change start this heavy build+smoke regardless of which files
    # changed — exactly the path-gating this workflow exists to enforce. Tier 0
    # has no `paths:` filter, so every PR triggers it and only its job-level
    # `non-code` gate decides whether it does any work — which is why it DOES
    # keep labeled/unlabeled: there the label gate must re-run/skip on toggle.
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'docker/**'
      - '**/Dockerfile'
      - 'compose*.yml'
      - '.dockerignore'
      - 'docker-bake.hcl'
      - 'build.*'
      - 'scripts/launch-agent.*'
      # build-image* also matches build-image-lib.*, the sourced helpers that
      # decide whether the layer-set image is current.
      - 'scripts/build-image*'
      # The layer-set selector and digest decide which set is built and the
      # labels its image is stamped with.
      - 'scripts/layers-*'
      - 'scripts/smoke-test*'
      # Source suites routed out of Tier 0 because they need a built/staged
      # helper, the image's /workspace contract, or PostgreSQL server binaries.
      - 'scripts/test-gh-review-threads.sh'
      - 'scripts/test-dc-helpers.sh'
      - 'scripts/test-pg-dev-up-scoped.sh'
      - 'scripts/test-pnpm-shadow-wrapper.sh'
      - 'commands/smoke-test.*'
      - '.github/workflows/native-linux-build.yml'

permissions:
  contents: read

concurrency:
  group: native-linux-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build image + smoke test
    runs-on: ubuntu-latest
    # Skip when the PR carries the repo's `non-code` label (docs/tasks-only
    # changes that need no rebuild + full CI). On Tier 1 this is pure
    # belt-and-suspenders — the path + base-branch gates above already skip every
    # docs/`non-code` PR (none match the image `paths:`) — but it keeps the gate
    # expression identical to Tier 0's. Unlike Tier 0, Tier 1 does NOT trigger on
    # labeled/unlabeled (see `on:` above), so this gate is evaluated on
    # opened/synchronize/reopened, not on a bare label toggle — which is fine,
    # because here the path + base gates, not the label, decide whether Tier 1
    # runs at all.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'non-code') }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Both cache keys are computed here, once, because the layers key must
      # embed the base key (see "Restore layers image cache") and actions/cache
      # exposes no output carrying the key it was given. Spelling the base
      # hashFiles list out twice would let the two drift apart.
      #
      # The base key is conservatively keyed on every input baked into the base
      # image: any change under docker/shared/**, to
      # PSScriptAnalyzerSettings.psd1 (also COPY'd into the base), or to
      # .dockerignore (which filters the build context feeding every base COPY,
      # so a change there can alter or break a base-only COPY input) busts the
      # key even for files used only by the agent layer (a harmless extra base
      # rebuild). It covers every file scripts/base-source-files.txt lists; the
      # layer-set selector and digest are deliberately absent, since the base
      # build never reads them.
      #
      # The layers key also carries the set's own digest, the value build.sh
      # stamps as powbox.layers.digest: hashFiles() hashes file contents only,
      # so a rename-only edit under docker/layers/full/ would otherwise keep the
      # key while changing the digest. A set the digest script rejects gets a
      # placeholder here, so the lean pass still runs and the full build reports
      # the contract error.
      - name: Compute image cache keys
        id: keys
        shell: bash
        env:
          BASE_INPUTS: ${{ hashFiles('docker/base/Dockerfile', 'docker/shared/**', 'docker-bake.hcl', 'scripts/build-image.sh', 'PSScriptAnalyzerSettings.psd1', '.dockerignore') }}
          LAYERS_INPUTS: ${{ hashFiles('docker/layers/full/**', 'scripts/layers-select.sh', 'scripts/layers-digest.sh', 'scripts/build-image-lib.sh') }}
        run: |
          set -euo pipefail
          base="powbox-base-${RUNNER_OS}-${BASE_INPUTS}"
          echo "base=${base}" >>"$GITHUB_OUTPUT"
          digest="$(./scripts/layers-digest.sh docker/layers/full)" || digest=undigested
          echo "layers=powbox-layers-full-${RUNNER_OS}-${BASE_INPUTS}-${LAYERS_INPUTS}-${digest#sha256:}" >>"$GITHUB_OUTPUT"

      # Cache-awareness, footprint-respecting edition. The cheap, robust win is
      # to cache the EXPENSIVE base image (node:24-trixie-slim + ~12 apt groups,
      # ~13 min cold) as a docker-save tarball keyed on its inputs. On a hit we
      # load it and rebuild only the agent layers; on a miss we build base+agent
      # fresh and save the base for next time. This works with the DEFAULT docker
      # buildx driver (shared image store) that the two-stage local-FROM bake
      # (agent FROM powbox-agent-base:latest) needs. buildx `type=gha` cache was
      # NOT used: it requires the docker-container driver, which cannot resolve a
      # locally-built FROM image across the base->agent stages, and wiring it
      # cleanly would mean restructuring docker-bake.hcl / build.sh — out of this
      # task's footprint. The fallback path (full build) is always correct, so a
      # cold/empty cache only costs time, never correctness.
      # Same-PR-by-design: this cache is seeded on pull_request runs, so the
      # first push of an image PR warms THIS PR's base cache (the one-time cold
      # base build hides behind human review latency) and later pushes hit it
      # warm. It is NOT shared across PRs — a cross-PR/default-branch warmup was
      # considered and declined (it would add recurring main-branch CI for a
      # saving not felt). So a cold cache on a fresh PR is expected, not a bug.
      - name: Restore base image cache
        id: basecache
        uses: actions/cache@v4
        with:
          path: /tmp/powbox-base-image.tar
          # No restore-keys on purpose — a prefix fallback could load a STALE
          # base that build.sh would reuse without rebuilding.
          key: ${{ steps.keys.outputs.base }}

      # Lean pass. No .powbox-layers exists in a fresh checkout (it is
      # gitignored), so the agent is built directly on the base. A loaded
      # tarball is deleted once loaded: on a hit actions/cache saves nothing, and
      # the job holds two of them (the layers tarball repeats every base layer).
      - name: Build lean image (base + agent, no layer set)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.basecache.outputs.cache-hit }}" = "true" ]; then
            echo "Base cache HIT — loading powbox-agent-base:latest from tarball, rebuilding agent layers only."
            docker load -i /tmp/powbox-base-image.tar
            rm -f /tmp/powbox-base-image.tar
            # ensure_base_image in build.sh sees the loaded base and skips the
            # base rebuild, so only the agent layers build here.
            ./build.sh agent
          else
            echo "Base cache MISS — building base + agent from scratch."
            ./build.sh all
            echo "Saving base image tarball for the next run."
            docker save -o /tmp/powbox-base-image.tar powbox-agent-base:latest
          fi
          set_label="$(docker image inspect powbox-agent:latest --format '{{json .Config.Labels}}' | jq -r '."powbox.layers.set" // empty')"
          if [ -n "$set_label" ]; then
            echo "FAIL: the lean pass built powbox-agent:latest on layer set '${set_label}', not directly on the base." >&2
            exit 1
          fi
          echo "Lean pass: powbox-agent:latest carries no powbox.layers.set label."

      # POWBOX_SMOKE_REQUIRE_IMAGE=1 turns a missing image into a hard error and
      # makes the IMAGE-gated stages fail instead of self-skipping into a false
      # "all green" — so a missing image can never be reported here as a pass. It
      # does not suppress the self-skips that have other causes: the Podman stage's
      # nested-run checks still self-skip when /dev/net/tun is absent (the hosted
      # runner has none), leaving only its static engine wiring validated. That is
      # acceptable, not a failure — but it does mean a green run here can still be
      # a PARTIAL smoke, so read the run's skip banner rather than the job status
      # alone. The pg-dev-up and self-hosted stages run in full; task 005's
      # dir-mount stage has since merged as Stage 5 and runs here too, subject to
      # its own host gates. The full pass below runs the same umbrella with the
      # same flag.
      - name: Smoke test - lean image (image required, no image-gated self-skip)
        env:
          POWBOX_SMOKE_REQUIRE_IMAGE: '1'
        run: ./commands/smoke-test.sh

      # Full pass. Selecting the set is a gitignored file, so the tree stays
      # clean and the stamped commit does not gain -dirty; the check-ignore
      # guard fails the step if that ever stops being true.
      - name: Select the full layer set
        shell: bash
        run: |
          set -euo pipefail
          printf 'full\n' >.powbox-layers
          git check-ignore -q .powbox-layers || {
            echo "FAIL: .powbox-layers is not gitignored, so selecting a set would stamp the full image -dirty." >&2
            exit 1
          }
          [ "$(./scripts/layers-select.sh)" = full ]

      # The layer-set image cached like the base, and for the same reasons. The
      # key embeds the base key, so a base change re-keys the layers too, plus
      # the set's own directory, its digest (see "Compute image cache keys"),
      # the two scripts that decide the labels the tarball was stamped with, and
      # scripts/build-image-lib.sh, which holds build.sh's test of whether those
      # labels are still current. An entry is immutable, so a change to any of
      # these that the key missed would leave a stale entry the set is rebaked
      # past on every run; the next step only warns about that, so the key's
      # coverage is a cost question, not a correctness one. No restore-keys, as
      # for the base. Only the committed `full` set is cached;
      # docker/layers/custom/ is never built here.
      - name: Restore layers image cache
        id: layerscache
        uses: actions/cache@v4
        with:
          path: /tmp/powbox-layers-image.tar
          key: ${{ steps.keys.outputs.layers }}

      # Stays on the `agent` target: `all` always bakes the layer-set image, and
      # on a runner whose BuildKit cache is empty that reinstalls the whole set
      # even with both tarballs loaded. `agent` bakes only when build.sh's
      # currency test (layers_stale_reason in scripts/build-image-lib.sh) calls
      # the image stale, so after loading a hit the step asks that same test,
      # sourced as build-image.sh sources it and given the arguments build.sh
      # passes, rather than re-deriving it here: a copy drifts from the script,
      # and each drift turns a stale entry into a false failure that the
      # immutable entry repeats on every push. When the test calls the loaded
      # image current, build.sh must bake nothing, and the step fails if it does.
      # Whether it baked is read from build.sh's own bake and reuse reports, not
      # from the image ID: an ID is content-addressed, so a bake can reproduce it.
      # When it calls it stale, every run rebakes until the entry goes, and the
      # step warns with the test's reason and the remedy instead of failing.
      # Most often the entry is simply stale: a base entry evicted and
      # re-created while the layers entry survived under the same key, so the
      # loaded image records a different base ID. A reason that returns once the
      # entry has been deleted and re-saved is not a stale entry: either the
      # test does not survive docker save / docker load, or the set and digest
      # this step derives no longer match what build.sh derives. The warning
      # names both.
      - name: Build full image (base + layers + agent, layer set full)
        shell: bash
        env:
          LAYERS_CACHE_KEY: ${{ steps.keys.outputs.layers }}
        run: |
          set -euo pipefail
          expect_reuse=false
          if [ "${{ steps.layerscache.outputs.cache-hit }}" = "true" ]; then
            echo "Layers cache HIT — loading powbox-agent-layers:latest from tarball."
            docker load -i /tmp/powbox-layers-image.tar
            rm -f /tmp/powbox-layers-image.tar
            # shellcheck disable=SC1091 # build.sh's own currency test
            . ./scripts/build-image-lib.sh
            # The base build.sh compares against is the one loaded in the lean
            # pass: without --pull, the agent target builds a base only when
            # none exists. An undeterminable digest is passed empty, as build.sh
            # passes it, and is never current.
            layers_set="$(./scripts/layers-select.sh)"
            digest="$(./scripts/layers-digest.sh "docker/layers/${layers_set}")" || digest=""
            reason="$(layers_stale_reason "$layers_set" "$digest")"
            if [ -z "$reason" ]; then
              echo "build.sh's currency test calls the cached layer-set image current; expecting no layer-set bake."
              expect_reuse=true
            else
              echo "::warning title=Stale layers cache entry::build.sh's currency test rejects the cached layer-set image: ${reason}. The entry is immutable, so every run rebakes the set until it is deleted: gh cache delete ${LAYERS_CACHE_KEY}. Usual causes: a base entry evicted and re-created while this one survived, or an input of the test that the layers key does not cover (add it to the key). If the same reason returns once the entry has been re-saved, deleting it again will not help: either the test does not survive docker save / docker load (fix scripts/build-image*.sh), or this step's set and digest no longer match the ones build.sh derives (fix this step)."
            fi
          else
            echo "Layers cache MISS — build.sh bakes the layer-set image."
          fi
          build_log="${RUNNER_TEMP}/powbox-build-full.log"
          ./build.sh agent | tee "$build_log"
          if [ "$expect_reuse" = true ]; then
            # The bake line is checked first and on its own: a build.sh that
            # reports reuse and then bakes anyway still baked.
            if grep -q "^Baking ${POWBOX_LAYERS_TAG}: " "$build_log"; then
              echo "FAIL: build.sh's currency test called the cached layer-set image current, yet build.sh baked the set again. If build.sh also reported reusing it, ensure_layers_image no longer stops after that report; otherwise its decision depends on more than the loaded images and the working tree. Fix it in scripts/build-image*.sh." >&2
              exit 1
            fi
            if ! grep -qxF "Layer-set image ${POWBOX_LAYERS_TAG} is current for set '${layers_set}'; reusing it." "$build_log"; then
              echo "FAIL: build.sh reported neither reusing nor baking ${POWBOX_LAYERS_TAG}, so this step cannot tell whether it baked the set: the messages ensure_layers_image prints in scripts/build-image.sh no longer match the ones this step reads. Update one to match the other." >&2
              exit 1
            fi
          fi
          if [ "${{ steps.layerscache.outputs.cache-hit }}" != "true" ]; then
            echo "Saving layers image tarball for the next run."
            docker save -o /tmp/powbox-layers-image.tar powbox-agent-layers:latest
          fi
          set_label="$(docker image inspect powbox-agent:latest --format '{{json .Config.Labels}}' | jq -r '."powbox.layers.set" // empty')"
          if [ "$set_label" != full ]; then
            echo "FAIL: the full pass built powbox-agent:latest on layer set '${set_label:-none}', not 'full'." >&2
            exit 1
          fi
          echo "Full pass: powbox-agent:latest carries powbox.layers.set=full."

      - name: Smoke test - full image (image required, no image-gated self-skip)
        env:
          POWBOX_SMOKE_REQUIRE_IMAGE: '1'
        run: ./commands/smoke-test.sh

      # Runs once, against the full image, after both passes: it is a
      # launcher-level check, and a second run on the lean image would add no
      # coverage.
      #
      # The smoke steps above run the BASH umbrella, which never invokes the
      # PowerShell driver — so before this step nothing in CI executed
      # scripts/smoke-test-worktree-metadata.ps1 at all. That is the same false
      # green one level up from the one task 053a closed inside the driver: the
      # .ps1 is not a Windows-only file (commands/smoke-test.ps1 runs anywhere
      # pwsh runs, native Linux included), yet its Stage 6 mirror shipped with no
      # automated execution anywhere.
      #
      # This runner is exactly the configuration where the mountpoint-ownership
      # assertions have TEETH — native Linux, a rootful Docker daemon, and an
      # unprivileged invoker (`runner`, uid 1001) — which is otherwise reachable
      # only on a maintainer's Linux desktop. `pwsh` is preinstalled on
      # ubuntu-latest (Tier 0 relies on the same fact).
      #
      # Only the Stage 6 driver runs, not the whole PowerShell umbrella: the other
      # stages are engine/host checks the Bash umbrella just ran, and re-running
      # them would roughly double the job for no new coverage. Stage 6 is the one
      # stage whose PowerShell half contains logic the Bash half cannot vouch for.
      #
      # Both extra assertions here are deliberate. A self-skip is a FAILURE rather
      # than a note, because on this runner every skip reason is impossible (image
      # present via REQUIRE_IMAGE, host is Linux, GNU stat, engine can bind-mount —
      # the Bash Stage 6 above proves the last one every run), so a skip means the
      # coverage silently stopped running. And the ok-line count is checked because
      # 053a's own round-1 defect was an artifact that was correct but never
      # REACHED — a green proving the driver ran is not the same as a green proving
      # the assertions ran.
      - name: Smoke test - PowerShell Stage 6 driver (mountpoint-ownership mirror)
        shell: bash
        env:
          POWBOX_SMOKE_REQUIRE_IMAGE: '1'
        run: |
          set -euo pipefail
          marker="$(mktemp)"
          log="$(mktemp)"
          POWBOX_SMOKE_SKIP_MARKER="$marker" \
            pwsh -NoProfile -File ./scripts/smoke-test-worktree-metadata.ps1 \
            -Image powbox-agent:latest 2>&1 | tee "$log"
          if [ -s "$marker" ]; then
            echo "FAIL: the PowerShell Stage 6 driver self-skipped on a runner where no skip reason is legitimate: $(cat "$marker")" >&2
            exit 1
          fi
          owners="$(grep -c 'ok: mountpoint ownership (' "$log" || true)"
          if [ "$owners" -ne 3 ]; then
            echo "FAIL: expected the 3 mountpoint-ownership assertions (tmpfs / multi-component / durable-bind) to run, saw $owners." >&2
            exit 1
          fi
          echo "PowerShell Stage 6 driver: all 3 mountpoint-ownership assertions ran with real teeth."
