# powbox: resolve unqualified image names the way Docker does. Installed as a
# drop-in (/etc/containers/registries.conf.d/10-powbox.conf) beside the
# containers-common shortnames.conf, whose aliases still win for the names they
# list.
#
# Exactly one search registry. With one there is nothing to choose, so a short
# name such as `traefik/whoami` resolves to docker.io/traefik/whoami with or
# without a terminal. With more than one, a short name is ambiguous: any of them
# could serve a squatted image of that name, and enforcing mode answers by
# prompting on a terminal (which blocks an agent) or, without one, by failing
# with "short-name resolution enforced but cannot prompt without a TTY".
unqualified-search-registries = ["docker.io"]

# Podman's default, stated so a change of default cannot loosen it: permissive
# mode would try every search registry in turn instead of refusing ambiguity.
short-name-mode = "enforcing"
